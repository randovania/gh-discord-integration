[project]
name = "pr-health-report"
version = "0.1.0"
description = "Periodic Discord report on open PR health across the randovania org"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pygithub>=2.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.31",
    "requests>=2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "SIM",     # flake8-simplify
    "PTH",     # flake8-use-pathlib
    "PT",      # flake8-pytest-style
    "RUF",     # ruff-specific
]

[tool.ruff.per-file-target-version]
# The DO function runs on the python:3.11 runtime, not the project's 3.14
"webhook/**" = "py311"

