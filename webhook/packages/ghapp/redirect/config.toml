[github]
org = "randovania"

# Repositories to skip entirely (e.g. mirrors, inactive forks kept for reference).
skip_repos = [
    "dread-editor",
    "Super-Duper-Metroid",
]

# PR authors treated as dependency bots; their PRs are grouped under "Dependency updates".
# Defaults are used if this key is absent.
dependency_authors = [
    "dependabot[bot]",
    "renovate[bot]",
    "pre-commit-ci[bot]",
]

[webhook]
# Related PR events (opened + review requests, pushes, approve → merge queue → merged) edit the PR's
# previous message instead of posting, if it was last updated within this many minutes.
merge_window_minutes = 30

# Push events are dropped unless the repo is listed here ("owner/repo", or a bare name for the org's repos).
push_repos = [
    "MetroidAdvRandomizerSystem/mars-fusion-asm",
    "MetroidAdvRandomizerSystem/mars-mzm-decomp",
    "MetroidAdvRandomizerSystem/mars-patcher-py",
]

# Comments (on issues, PRs, reviews and commits) by these accounts are dropped, e.g. CI reports.
# Their other events, like releases published by a workflow, still post.
ignored_comment_authors = [
    "github-actions[bot]",
]

# Discord channel IDs per named channel.
# Right-click a channel in Discord (with Developer Mode on) → Copy Channel ID.
# Bot token is read from the DISCORD_TOKEN environment variable.
[discord.channels]
default = "914294272579227668"
library-dev = "1309169554592759879"
am2r-dev = "1117068391858065509"
cave-story-dev = "914294362937098270"
factorio-dev = "1244352107277189252"
metroid-dread-dev = "914294339235106836"
metroid-fusion-dev = "1215675687936196608"
metroid-planets-dev = "1254054946681257995"
metroid-prime-dev = "914294412765454426"
mp2-echoes-dev = "914294505107251231"
mp3-corruption-dev = "914294515903385650"
mp-hunters-dev = "1362190173953065162"
