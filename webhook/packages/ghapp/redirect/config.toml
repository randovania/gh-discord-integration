YAMS                            = "am2r-dev"

# One game label → that game's channel; neither or both → both channels.
[repo_channels."MetroidAdvRandomizerSystem/mars-patcher-py"]
channels = ["metroid-fusion-dev", "metroid-zero-mission-dev"]
label_channels = { "game: mf" = "metroid-fusion-dev", "game: zm" = "metroid-zero-mission-dev" }

# Map PR label → channel name.  Label mapping takes priority over repo mapping.
[label_channels]
"game: AM2R"                    = "am2r-dev"
"game: Cave Story"              = "cave-story-dev"
"game: Factorio"                = "factorio-dev"
"game: Metroid Dread"           = "metroid-dread-dev"
"game: Metroid Fusion"          = "metroid-fusion-dev"
"game: Metroid Prime 1"         = "metroid-prime-dev"
"game: Metroid Prime 2 Echoes"  = "mp2-echoes-dev"
# "game: Metroid Prime 3 Corruption"         = "mp3-corruption-dev"
"game: Metroid Planets"         = "metroid-planets-dev"
"game: Metroid Prime Hunters"   = "mp-hunters-dev"
"game: Metroid Zero Mission"    = "metroid-zero-mission-dev"
"game: Metroid: Samus Returns"  = "samus-returns-dev"
"game: Yoku's Island Express"   = "yoku-dev"

# Map GitHub username → Discord user ID (numeric).
# When present, "changes requested" lines mention the author directly.
# Example: "octocat" = "123456789012345678"
[user_map]