# Map repository name → channel name (from discord.channels above).
# PRs in repos not listed here go to the "default" channel.
# Repos outside the [github] org are ignored unless listed here as "owner/repo".
# An entry can also be a table with a list of `channels` and its own `label_channels`
# (see MetroidAdvRandomizerSystem/mars-patcher-py below).
[repo_channels]

"MetroidAdvRandomizerSystem/mars-fusion-asm" = "metroid-fusion-dev"
"MetroidAdvRandomizerSystem/mars-mzm-decomp" = "metroid-zero-mission-dev"

construct-extensions            = "library-dev"
